name: Locate standard iSH instruction failure
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-candidate.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86-runtime-probes
          run-id: 36987165269
          github-token: ${{ github.token }}
      - name: Inspect actual completed x86 binary
        run: |
          objdump -d -C --start-address=0x000f1d60 --stop-address=0x000f1e40 tokio-probe
          nm -n -C tokio-probe > symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          addresses=[0x000f1dbc]
          symbols=[]
          for line in Path('symbols.txt').read_text().splitlines():
              fields=line.split(' ',2)
              try: address=int(fields[0],16)
              except ValueError: continue
              if len(fields)==3: symbols.append((address,fields[2]))
          for address in addresses:
              before=[s for s in symbols if s[0]<=address]
              print(hex(address),before[-1] if before else None)
          PY
