name: Check 32-bit Rust runtime with Darwin standard iSH
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/preflight.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: i686-unknown-linux-musl
          components: rustfmt,rust-src
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,uv,dotslash
      - name: Compile static Rust and diagnostic probes
        run: |
          chmod +x build-tools/*
          mkdir root
          cat > "$RUNNER_TEMP/preflight.rs" <<'RS'
          use std::process::Command;
          fn main() {
              assert_eq!(std::mem::size_of::<usize>(), 4);
              let now = std::time::SystemTime::now().duration_since(std::time::UNIX_EPOCH).unwrap();
              println!("x86-runtime-ok: unix={} float={}", now.as_secs(), 1.25_f64.sqrt());
              for n in 0..4 {
                  std::thread::spawn(move || {
                      let output = Command::new("/bin/sh").args(["-c", "printf 'x86-child-ok\\n'; exit 17"]).output().unwrap();
                      assert_eq!(output.status.code(), Some(17));
                      assert_eq!(output.stdout, b"x86-child-ok\n");
                      println!("x86-worker-{n}-ok");
                  }).join().unwrap();
              }
              println!("PASS: ELF32 Rust startup, clock, float, threads and worker shell spawns");
          }
          RS
          rustc --edition 2024 --target i686-unknown-linux-musl -C target-cpu=pentium4 -C opt-level=2 \
            -C linker="$PWD/build-tools/zigcc" -C link-self-contained=no \
            "$RUNNER_TEMP/preflight.rs" -o root/preflight
          build-tools/zigcc -O2 -static tests/ish-syscall-probe.c -o root/syscall-probe
          build-tools/zigcc -O2 -static tests/signal-probe.c -o root/signal-probe
          readelf -h root/preflight | grep -q 'Class:.*ELF32'
          readelf -h root/preflight | grep -q 'Machine:.*Intel 80386'
      - name: Test actual patched Tokio and prepare its ELF32 subprocess harness
        run: |
          git clone --depth 1 --branch rust-v0.160.0 https://github.com/openai/codex.git upstream
          python3 scripts/prepare-source.py upstream
          (cd upstream && just fmt)
          python3 scripts/prepare-rust-std.py upstream/ish-compat
          ISH_PATCHED_SOURCE="$PWD/upstream" ISH_X86_HARNESS_OUT="$PWD/root/tokio-probe" bash tests/verify-subprocess.sh
      - name: Check rebuilt runtime on normal Linux under QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          qemu-i386-static root/tokio-probe
      - uses: actions/upload-artifact@v4
        with:
          name: x86-runtime-probes
          path: root/*
  runtime:
    needs: compile
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x86-runtime-probes
          path: root
      - name: Build unmodified released iSH with its Darwin and ARM64 backend
        run: |
          brew install meson ninja llvm lld libarchive pkg-config coreutils
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          # Released iSH copies the host hostname into a 65-byte guest field.
          # Use an ordinary short name in this disposable VM, like the iOS app.
          hostname
          sudo hostname ish-x86-test
          git clone --depth 1 --branch builds/494 https://github.com/ish-app/ish.git emulator
          test "$(git -C emulator rev-parse HEAD)" = 216cf98a7cda1d68221add374630ede00aae9cd4
          git -C emulator submodule update --init --depth 1 deps/libapps
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized -Dlog=strace
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Run actual ELF32 programs through standard iSH
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          ulimit -n 4096
          chmod +x root/preflight root/tokio-probe root/syscall-probe root/signal-probe
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86
          curl -fsSL "$base/alpine-minirootfs-3.23.3-x86.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-x86.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
          # The CLI emulator does not create the device nodes the iOS app supplies.
          # Initialize the same ordinary Alpine devices inside its fake filesystem.
          # Keep syscall tracing separate so it cannot overwrite a Rust panic.
          exec 666>runtime-strace.log
          timeout 120 emulator/build/ish -f guest /bin/sh -ec '
            mknod -m 666 /dev/null c 1 3
            mknod -m 666 /dev/zero c 1 5
            mknod -m 666 /dev/full c 1 7
            mknod -m 666 /dev/random c 1 8
            mknod -m 666 /dev/urandom c 1 9
            mknod -m 666 /dev/tty c 5 0
            mknod -m 666 /dev/ptmx c 5 2
            test -c /dev/null
          ' 2>>runtime-stderr.log
          timeout 120 emulator/build/ish -f guest /bin/sh -c 'printf "guest-shell-ok\\n"; ls -l /bin/sh /bin/busybox /lib/ld-musl-i386.so.1' 2>>runtime-stderr.log
          timeout 120 emulator/build/ish -f guest /preflight 2>>runtime-stderr.log
          chmod +x root/signal-probe
          timeout 120 emulator/build/ish -f guest /signal-probe 2>>runtime-stderr.log
          timeout 120 emulator/build/ish -f guest /tokio-probe 2>>runtime-stderr.log
          timeout 120 emulator/build/ish -f guest /syscall-probe 2>>runtime-stderr.log
          # At most initial racing detection calls may use the unsupported operation.
          test "$(grep -ac 'unsupported futex operation 137' runtime-strace.log)" -le 8
      - name: Print runtime failure detail
        if: failure()
        run: |
          cat runtime-stderr.log || true
          grep -a -B 8 -A 8 -E '0xffffffea|missing syscall' runtime-strace.log || true
          tail -100 runtime-strace.log || true
      - name: Collect native Darwin emulator backtrace
        if: failure()
        run: |
          chmod +x root/*
          lldb --batch -o 'run -f guest /bin/sh -c true' -k 'thread backtrace all' emulator/build/ish || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-runtime-preflight-logs
          path: 'runtime-*.log'
