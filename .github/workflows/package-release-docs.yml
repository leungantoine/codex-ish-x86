name: Package verified x86 release with current guide
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build and verify Codex for standard iSH]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require a successfully built and verified x86 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          case "$tag" in ish-x86-v0.160.0-*) ;; *) echo 'Expected verified 0.160.0 x86 release' >&2; exit 1 ;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run" != null
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run --jq .conclusion)" = success
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$run" = "$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
            test "$tag" = "ish-x86-v0.160.0-$(jq -r '.workflow_run.run_number' "$GITHUB_EVENT_PATH")"
          fi
          echo "SOURCE_RUN=$run" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'codex-ish-x86.tar.gz*'
          sha256sum -c codex-ish-x86.tar.gz.sha256
          mkdir package
          tar -xzf codex-ish-x86.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          package/codex --version | grep -Fx 'codex-cli 0.160.0'
          grep -F a956835d020762cb2b570053af06f643a11c0ecc package/BUILDINFO
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('package')
          info=json.loads((p/'compat/PATCHINFO.json').read_text())
          assert info['sqlite_registry_sha256']=='b1f111c8c41e7c61a49cd34e44c7619462967221a6443b0ec299e0ac30cfb9b1'
          assert 'Only sqlite3.c uses -O0' in info['sqlite_codegen_policy']
          assert hashlib.sha256((p/'compat/zigcc').read_bytes()).hexdigest()==info['zigcc_sha256']
          assert info['regex_automata_registry_sha256']=='5276caf25ac86c8d810222b3dbb938e512c55c6831a10f3e6ed1c93b84041f1c'
          assert 'Only i686 regex_automata uses opt-level=0' in info['regex_automata_codegen_policy']
          assert hashlib.sha256((p/'compat/rustc-wrapper').read_bytes()).hexdigest()==info['rustc_wrapper_sha256']
          assert hashlib.sha256((p/'compat/linux_fds.rs').read_bytes()).hexdigest()==info['patched_source_sha256']['codex-rs/utils/pty/src/linux_fds.rs']
          assert info['concurrent_queue_registry_sha256']=='4ca0197aee26d1ae37445ee532fefce43251d24cc7c166799f4d46817f1d3973'
          assert 'full memory barrier' in info['concurrent_queue_fence_policy']
          assert hashlib.sha256((p/'compat/concurrent-queue-lib.rs').read_bytes()).hexdigest()==info['patched_source_sha256']['codex-rs/vendor/concurrent-queue-2.5.0/src/lib.rs']
          assert info['event_listener_registry_sha256']=='e13b66accf52311f30a0db42147dadea9850cb48cd070028831ae5f5d4b856ab'
          assert 'full memory barrier' in info['event_listener_fence_policy']
          assert hashlib.sha256((p/'compat/event-listener-notify.rs').read_bytes()).hexdigest()==info['patched_source_sha256']['codex-rs/vendor/event-listener-5.4.1/src/notify.rs']
          PY
          (cd package && sha256sum codex codex-responses-api-proxy codex-path/rg diagnostics/ish-syscall-probe > "$RUNNER_TEMP/executables.sha256")
      - name: Record successful real build and emulator results in the guide
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          start=s.index('**Status:')
          stop=s.index('\n\n',start)
          s=s[:start]+('**Status: Codex 0.160.0 built and verified for 32-bit x86.** '
            'Static ELF32 checks, QEMU, native Linux, and unmodified standard iSH passed. '
            'Physical iOS authentication, interactive tasks, performance and background behavior remain to be tested. '
            '[Download the latest Release](https://github.com/leungantoine/codex-ish-x86/releases/latest).')+s[stop:]
          s=s.replace('**Use this only after an installable Release appears.** In standard iSH\'s x86 Alpine root:',
                      'In standard iSH\'s x86 Alpine root:')
          anchor='`scripts/prepare-source.py` checks'
          position=s.index(anchor)
          s=s[:position]+('11. Add LLVM compiler-rt 19.1.7\'s atomic size/alignment query at links requesting libatomic; '
              'preserve real atomics and OpenSSL\'s existing lock fallback. Source hash and LLVM license are included.\n'
              '12. Compile only `sqlite3.c` with `-O0` to avoid unsupported `CVTDQ2PD` in optimized date conversion. '
              'The locked source, CPU features and floating ABI are unchanged. SQLite performance may be lower.\n\n')+s[position:]
          # Keep a concise durable history; the detailed failed-run logs remain linked.
          if '\n### Current compilation finding' in s:
              s=s[:s.index('\n### Current compilation finding')]
          start=s.index('Only a successful build and emulator verification')
          stop=s.index('\n## Troubleshooting',start)
          run=os.environ['SOURCE_RUN']
          results=('Verified in [full build '+run+'](https://github.com/leungantoine/codex-ish-x86/actions/runs/'+run+'): '
              '62 PTY tests and 162 Linux sandbox library tests; native subprocess modes for normal Linux, injected '
              'EINVAL, fatal EPERM and iSH kernel identity; all four static ELF32 executables and checksums; '
              'QEMU version and diagnostics; four actual CLI shell loops using mocked GPT-6/GPT-6.1 tool requests '
              'on Linux and unmodified standard iSH; real app-server pipe and PTY output with exit status 17. '
              'The final documentation package additionally verifies fresh bash and ash startup PATH, the installed '
              'plain `codex` shell loop and repeated installation without duplicate PATH entries. '
              'Mocked inference does not establish live service acceptance or account/model access.\n\n'
              'Supporting focused checks: [Rust/Tokio and OpenSSL atomics](https://github.com/leungantoine/codex-ish-x86/actions/runs/36952380152), '
              '[SQLite date and floating point](https://github.com/leungantoine/codex-ish-x86/actions/runs/36958879061), '
              'and [dependency lock metadata](https://github.com/leungantoine/codex-ish-x86/actions/runs/36936516270) passed. '
              'Earlier [full build 36952350602](https://github.com/leungantoine/codex-ish-x86/actions/runs/36952350602) '
              'exposed SQLite\'s unsupported optimized conversion; publication was blocked until the replacement build passed.\n')
          s=s[:start]+results+s[stop:]
          s=s.replace('Missing Release/download failure: the port has not passed publication gates or connectivity to GitHub failed.',
                      'Release/download failure: check connectivity to GitHub and the latest Release assets.')
          p.write_text(s)
          PY
      - name: Package current documentation without changing executables
        run: |
          cp README.md package/README.md
          cp setup.sh package/setup.sh
          mkdir -p package/metadata
          cp metadata/README.md metadata/bazel-dependency-lock.patch package/metadata/
          (cd package && sha256sum -c "$RUNNER_TEMP/executables.sha256")
          (cd package && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf codex-ish-x86.tar.gz -C package .
          sha256sum codex-ish-x86.tar.gz > codex-ish-x86.tar.gz.sha256
          for name in codex codex-responses-api-proxy codex-path/rg diagnostics/ish-syscall-probe; do
            path="package/$name"
            readelf -h "$path" | grep -q 'Class:.*ELF32'
            readelf -h "$path" | grep -q 'Machine:.*Intel 80386'
            if readelf -l "$path" | grep -q INTERP; then exit 1; fi
            if readelf -d "$path" | grep -q '(NEEDED)'; then exit 1; fi
          done
      - name: Verify setup, startup and actual shell execution with this archive
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          mkdir "$RUNNER_TEMP/x86-uname"
          printf '#!/bin/sh\nif [ "$1" = -m ]; then echo i686; else /usr/bin/uname "$@"; fi\n' > "$RUNNER_TEMP/x86-uname/uname"
          chmod +x "$RUNNER_TEMP/x86-uname/uname"
          PATH="$RUNNER_TEMP/x86-uname:$PATH" CODEX_ISH_RELEASE_BASE="file://$PWD" sh setup.sh
          env -i HOME="$HOME" PATH=/usr/bin:/bin /bin/bash --login -c 'command -v codex; codex --version'
          env -i HOME="$HOME" PATH=/usr/bin:/bin /bin/busybox ash -l -c 'command -v codex; codex --version'
          python3 tests/reproduce-direct-model.py setup-final-x86 "$PWD/package/compat/models-direct.json" gpt-6-luna "$HOME/.local/bin/codex"
          PATH="$RUNNER_TEMP/x86-uname:$PATH" CODEX_ISH_RELEASE_BASE="file://$PWD" sh setup.sh
          test "$(grep -Fc 'export PATH="$HOME/.local/bin:$PATH"' "$HOME/.profile")" = 1
      - name: Publish installation-ready verified x86 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Document verified Codex x86 release from build $SOURCE_RUN"
            git push origin HEAD:main
          fi
          doc_commit=$(git rev-parse HEAD)
          gh release create "$SOURCE_TAG.1" codex-ish-x86.tar.gz codex-ish-x86.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$doc_commit" \
            --title 'Codex 0.160.0 for App Store iSH, with one-command setup' \
            --notes 'Preserves all four executable hashes from the verified real Codex x86 build. Includes current guide, setup, source-input hashes, generated dependency metadata and licenses. Startup PATH checks passed in fresh bash and ash login shells, and the installed command completed a real shell roundtrip using a mocked backend. Unmodified released standard iSH passed subprocess/tool checks. Physical iOS authentication, interactive tasks and performance remain to be tested; no iOS suspension fix is claimed. Commands can access guest files and network. See README.' --latest
      - uses: actions/upload-artifact@v4
        with:
          name: final-codex-ish-x86
          path: |
            codex-ish-x86.tar.gz
            codex-ish-x86.tar.gz.sha256
