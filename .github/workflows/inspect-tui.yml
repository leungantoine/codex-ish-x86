name: Inspect interactive Codex startup in standard iSH
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-tui.yml
permissions:
  contents: read
  actions: read
jobs:
  verify-ish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-ish-x86
          run-id: 37057721035
          github-token: ${{ github.token }}
      - name: Build unmodified released standard iSH Darwin ARM64 backend
        run: |
          brew install meson ninja llvm lld libarchive pkg-config coreutils
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          hostname
          sudo hostname ish-x86-test
          git clone --depth 1 --branch builds/494 https://github.com/ish-app/ish.git emulator
          test "$(git -C emulator rev-parse HEAD)" = 216cf98a7cda1d68221add374630ede00aae9cd4
          git -C emulator submodule update --init --depth 1 deps/libapps
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Prepare checksum verified x86 Alpine guest and release
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          sha256sum -c codex-ish-x86.tar.gz.sha256
          mkdir package root
          tar -xzf codex-ish-x86.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86
          curl -fsSL "$base/alpine-minirootfs-3.23.3-x86.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-x86.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          cp -a package root/codex
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
          # Alpine minirootfs omits nodes normally supplied by the iOS app.
          timeout 120 emulator/build/ish -f guest /bin/sh -ec '
            mknod -m 666 /dev/null c 1 3
            mknod -m 666 /dev/zero c 1 5
            mknod -m 666 /dev/full c 1 7
            mknod -m 666 /dev/random c 1 8
            mknod -m 666 /dev/urandom c 1 9
            mknod -m 666 /dev/tty c 5 0
            mknod -m 666 /dev/ptmx c 5 2
            test -c /dev/null
          '
      - name: Version and syscall checks in standard iSH
        run: |
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          timeout 120 emulator/build/ish -f guest /bin/sh -c '"$@"; result=$?; exit "$result"' ish-codex /codex/codex --version | grep -Fx 'codex-cli 0.160.0'
          timeout 120 emulator/build/ish -f guest /codex/diagnostics/ish-syscall-probe
      - name: Reproduce real interactive terminal startup
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          ulimit -n 4096
          cat > tui-diagnostic.py <<'PY'
          #!/usr/bin/env python3
          """Capture interactive Codex startup on a real host terminal without credentials."""
          import errno, fcntl, os, pty, select, signal, struct, sys, termios, time
          from pathlib import Path
          
          command = sys.argv[1:]
          log = open("tui-kernel.log", "wb", buffering=0)
          os.dup2(log.fileno(), 666)
          os.set_inheritable(666, True)
          pid, master = pty.fork()
          if pid == 0:
              os.environ["TERM"] = "xterm-256color"
              os.environ.pop("OPENAI_API_KEY", None)
              os.environ.pop("CODEX_API_KEY", None)
              os.execvp(command[0], command)
          os.close(666)
          fcntl.ioctl(master, termios.TIOCSWINSZ, struct.pack("HHHH", int(os.environ.get("TUI_ROWS", "44")), int(os.environ.get("TUI_COLS", "40")), 0, 0))
          transcript = bytearray()
          deadline = time.monotonic() + 90
          entered = False
          interrupted = False
          status = None
          pending = b""
          while time.monotonic() < deadline:
              ready, _, _ = select.select([master], [], [], 0.25)
              if ready:
                  try:
                      data = os.read(master, 65536)
                  except OSError as error:
                      if error.errno != errno.EIO:
                          raise
                      break
                  if not data:
                      break
                  transcript.extend(data)
                  pending += data
                  # Answer terminal queries; keep user input separate from replies.
                  for query, reply in [(b"\x1b[6n", b"\x1b[1;1R"),
                                       (b"\x1b[c", b"\x1b[?1;2c"),
                                       (b"\x1b[>c", b"\x1b[>0;1;0c"),
                                       (b"\x1b]10;?\x1b\\", b"\x1b]10;rgb:0000/0000/0000\x1b\\"),
                                       (b"\x1b]11;?\x1b\\", b"\x1b]11;rgb:ffff/ffff/ffff\x1b\\")]:
                      while query in pending:
                          os.write(master, reply)
                          pending = pending.replace(query, b"", 1)
                  pending = pending[-100:]
              waited, result = os.waitpid(pid, os.WNOHANG)
              if waited:
                  status = result
                  break
              if os.environ.get("TUI_ENTER") == "1" and not entered and time.monotonic() > deadline - 80:
                  os.write(master, b"\r")
                  entered = True
              if not interrupted and time.monotonic() > deadline - 30:
                  os.write(master, b"\x03\x03")
                  interrupted = True
          if status is None:
              waited, status_now = os.waitpid(pid, os.WNOHANG)
              if waited:
                  status = status_now
              else:
                  os.kill(pid, signal.SIGTERM)
                  _, status = os.waitpid(pid, 0)
          Path("tui-terminal.log").write_bytes(transcript)
          print("terminal transcript:", repr(bytes(transcript)[-20000:]))
          print("kernel log:", Path("tui-kernel.log").read_text(errors="replace"))
          print("emulator exit:", os.waitstatus_to_exitcode(status))
          PY
          for dimensions in 40x44 100x50; do
            export TUI_COLS="${dimensions%x*}" TUI_ROWS="${dimensions#*x}"
            python3 tui-diagnostic.py emulator/build/ish -f guest /bin/sh -c '"$@"; result=$?; exit "$result"' ish-codex /codex/codex --no-daemon --disable code_mode_host --disable code_mode --disable code_mode_only -c 'model="gpt-6-luna"' -c 'model_reasoning_effort="medium"' -c 'sandbox_mode="danger-full-access"' -c 'approval_policy="on-request"' -c 'model_catalog_json="/codex/compat/models-direct.json"'
            cp tui-terminal.log "tui-terminal-$dimensions.log"
            cp tui-kernel.log "tui-kernel-$dimensions.log"
          done
      - name: Identify unsupported instruction and actual linked function
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          log='\n'.join(p.read_text(errors='replace') for p in Path('.').glob('tui-kernel-*.log'))
          for address in re.findall(r'illegal instruction at (0x[0-9a-f]+)',log):
              pc=int(address,16)
              subprocess.run(['llvm-objdump','--demangle','--disassemble',f'--start-address={pc-32}',f'--stop-address={pc+64}','package/codex'],check=True)
              result=subprocess.run(['llvm-nm','--numeric-sort','--demangle','package/codex'],capture_output=True,text=True,check=True)
              symbols=[]
              for line in result.stdout.splitlines():
                  fields=line.split(' ',2)
                  if len(fields)!=3: continue
                  try: value=int(fields[0],16)
                  except ValueError: continue
                  if value<=pc: symbols.append((value,fields[2]))
              print('fault',address,'nearest symbol',symbols[-1] if symbols else None)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-ish-startup-logs
          path: |
            tui-kernel*.log
            tui-terminal*.log
